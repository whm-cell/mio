# Complete foundation composition: no default Web, SDK, shell, or model bundle.
- insert:
    - id: system-prompt
      name: '@deepseek-ai/dsh-system-prompt'
    - id: tools
      name: '@deepseek-ai/dsh-tools'
    - id: tool-executor-native
      name: '@deepseek-ai/dsh-tool-executor-native'
    - id: webserver
      name: '@deepseek-ai/dsh-host-webserver'
      config:
        host: !!js process.env.MIO_HOST ?? '127.0.0.1'
        port: !!js Number(process.env.MIO_PORT ?? 4310)
    - id: mio-foundation
      name: '@mio/plugin'
      config:
        tokenEnv: MIO_API_TOKEN
        allowedOrigins: !!js JSON.parse(process.env.MIO_ALLOWED_ORIGINS ?? '[]')
